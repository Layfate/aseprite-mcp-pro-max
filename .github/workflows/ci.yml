name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Integration tests skip automatically: Aseprite is not redistributable,
      # so CI runners do not have it. Run `npm test` locally with Aseprite installed.
      - run: npx vitest run
      - name: Server starts and lists tools
        run: node dist/index.js --version
