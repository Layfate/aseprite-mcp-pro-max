<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phaser sample</title>
  <style>html, body { margin: 0; background: #1a1c2c; }</style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
</head>
<body>
<script>
// Serve this folder over HTTP (e.g. `npx http-server examples/engines/phaser`); browsers block file:// loads.
// assets/ is generated by `npx tsx examples/build-samples.ts` (engine.phaser).
const tags = ["idle_e", "walk_e", "idle_w", "walk_w"];
new Phaser.Game({
  type: Phaser.AUTO,
  width: 320,
  height: 180,
  pixelArt: true,
  zoom: 3,
  backgroundColor: "#1a1c2c",
  scene: {
    preload() {
      this.load.aseprite("hero", "assets/hero.png", "assets/hero.json");
    },
    create() {
      this.anims.createFromAseprite("hero");
      tags.forEach((tag, i) => {
        this.add.sprite(40 + i * 80, 100, "hero").setOrigin(0.5, 0.75).play({ key: tag, repeat: -1 });
        this.add.text(40 + i * 80, 130, tag, { fontSize: "10px", color: "#f4f4f4" }).setOrigin(0.5, 0);
      });
    },
  },
});
</script>
</body>
</html>
