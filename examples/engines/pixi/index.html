<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixiJS sample</title>
  <style>html, body { margin: 0; background: #1a1c2c; }</style>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
</head>
<body>
<script>
// Serve this folder over HTTP (e.g. `npx http-server examples/engines/pixi`); browsers block file:// loads.
// assets/ is generated by `npx tsx examples/build-samples.ts` (engine.pixi).
(async () => {
  PIXI.TextureSource.defaultOptions.scaleMode = "nearest";
  const app = new PIXI.Application();
  await app.init({ width: 960, height: 540, background: "#1a1c2c" });
  document.body.appendChild(app.canvas);
  const sheet = await PIXI.Assets.load("assets/hero.json");
  // The PixiJS spritesheet format has no per-frame durations: use the tag's frame time
  // (idle 220 ms, walk 110 ms) as ticks at 60 fps.
  const ms = { idle_e: 220, walk_e: 110, idle_w: 220, walk_w: 110 };
  Object.keys(sheet.animations).forEach((tag, i) => {
    const s = new PIXI.AnimatedSprite(sheet.animations[tag]);
    s.anchor.set(0.5, 0.75);
    s.scale.set(3);
    s.position.set(120 + i * 240, 300);
    s.animationSpeed = 1000 / 60 / (ms[tag] ?? 100);
    s.play();
    app.stage.addChild(s);
  });
})();
</script>
</body>
</html>
